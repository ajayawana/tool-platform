name: Ozarbox OpenCode + Groq Developer

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number containing the Ozarbox command"
        required: true
        type: string
      command:
        description: "Command to execute"
        required: true
        type: string

permissions:
  actions: read
  contents: write
  pull-requests: write
  issues: read

# Never run two coding agents at the same time.
concurrency:
  group: ozarbox-opencode-groq-developer
  cancel-in-progress: false

jobs:
  opencode-developer:
    if: ${{ inputs.issue_number != '' && inputs.command != '' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check required Groq secret
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GROQ_API_KEY:-}" ]; then
            echo "::error::Missing GROQ_API_KEY. Add it in Settings > Secrets and variables > Actions before running this workflow."
            exit 1
          fi

      - name: Enforce one run per rolling 24 hours
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # Only count runs that actually started the coding-agent step. Missing-secret
          # failures and guard-blocked runs do not consume the daily Groq budget.
          gh api "repos/${GH_REPO}/actions/workflows/opencode-groq-developer.yml/runs?event=workflow_dispatch&per_page=100" > /tmp/workflow-runs.json
          python3 - <<'PY' > /tmp/recent-run-ids.txt
          import json, os
          from datetime import datetime, timedelta, timezone

          with open("/tmp/workflow-runs.json", encoding="utf-8") as f:
              data = json.load(f)
          cutoff = datetime.now(timezone.utc) - timedelta(hours=24)
          current = str(os.environ["CURRENT_RUN_ID"])
          for run in data.get("workflow_runs", []):
              if str(run.get("id")) == current:
                  continue
              created = datetime.fromisoformat(run["created_at"].replace("Z", "+00:00"))
              if created >= cutoff:
                  print(run["id"])
          PY

          while IFS= read -r prior_run_id; do
            [ -n "$prior_run_id" ] || continue
            gh api "repos/${GH_REPO}/actions/runs/${prior_run_id}/jobs?per_page=100" > /tmp/prior-jobs.json
            if jq -e '[.jobs[].steps[]? | select(.name == "Run OpenCode with strict usage limits" and (.status == "in_progress" or .status == "completed"))] | length > 0' /tmp/prior-jobs.json >/dev/null; then
              echo "Quota safety stop: coding agent already started in workflow run ${prior_run_id} within the last 24 hours."
              echo "Wait until 24 hours after that run before trying again."
              exit 1
            fi
          done < /tmp/recent-run-ids.txt
          echo "Quota guard passed: no coding-agent run started in the rolling 24-hour window."
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project dependencies
        run: npm install

      - name: Install OpenCode
        run: |
          set -euo pipefail
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          command -v opencode || true

      - name: Run OpenCode with strict usage limits
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENCODE_DISABLE_AUTOUPDATE: "true"
          OPENCODE_EXPERIMENTAL_OUTPUT_TOKEN_MAX: "1024"
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          ISSUE_BODY: ${{ inputs.command }}
        run: |
          set -euo pipefail
          if ! command -v opencode >/dev/null 2>&1; then
            echo "::error::OpenCode binary was not found after installation."
            exit 1
          fi
          {
            printf '%s\n\n' "You are the autonomous coding agent for Ozarbox."
            printf '%s\n' "Read AGENTS.md first if it exists, and follow its instructions."
            printf '%s\n' "TASK:"
            printf '%s\n' "$ISSUE_BODY"
            printf '%s\n' ""
            printf '%s\n' "Inspect the existing architecture before editing."
            printf '%s\n' "Prioritize repairing existing functionality; do not create new tools unless explicitly requested."
            printf '%s\n' "Make only focused, necessary changes."
            printf '%s\n' "Do not run web research or launch subagents."
            printf '%s\n' "Do not expose secrets or change GitHub settings."
            printf '%s\n' "Do not merge any pull request."
            printf '%s\n' "Complete the requested task thoroughly, not just by planning or summarizing. Make the smallest correct code changes, run checks, and fix any failures."
            printf '%s\n' "The workflow will run npm run check and npm run build after you finish."
          } > /tmp/ozarbox-task.txt

          # No custom agent-step or shell timeout is imposed. Provider token caps and
          # the rolling 24-hour run guard remain enabled to reduce free-tier quota risk.
          opencode run --auto --model groq/openai/gpt-oss-120b --agent build --title "Ozarbox issue #${ISSUE_NUMBER}" "$(cat /tmp/ozarbox-task.txt)"

      - name: Verify build
        run: |
          set -euo pipefail
          npm run check
          npm run build

      - name: Create branch and pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          ISSUE_TITLE: Ozarbox manual command
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "OpenCode made no file changes."
            exit 0
          fi
          BRANCH="ai/issue-${ISSUE_NUMBER}-run-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git config user.name "Ozarbox AI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ai: implement issue #${ISSUE_NUMBER}"
          git push --set-upstream origin "$BRANCH"
          PR_URL=$(gh pr create --base main --head "$BRANCH" --title "AI: ${ISSUE_TITLE}" --body "Implemented automatically by OpenCode + Groq. Original issue: #${ISSUE_NUMBER}. Automated checks: npm run check and npm run build. Not auto-merged.")
          echo "Created PR: $PR_URL"

name: Ozarbox Gemini AI Developer

on:
  issues:
    types: [opened, reopened, edited]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  gemini-developer:
    if: contains(github.event.issue.title, '[AI]') || contains(github.event.issue.body, '[AI]')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Gemini CLI
        run: npm install -g @google/gemini-cli@latest

      - name: Run Gemini coding agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.7-flash
          GEMINI_CLI_TRUST_WORKSPACE: "true"
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          {
            printf '%s\n\n' "You are the autonomous coding agent for Ozarbox."
            printf '%s\n' "Read AGENTS.md first and follow it strictly."
            printf '%s\n' "TASK TITLE:"
            printf '%s\n' "$ISSUE_TITLE"
            printf '%s\n' "TASK:"
            printf '%s\n' "$ISSUE_BODY"
            printf '%s\n' ""
            printf '%s\n' "Work directly in the checked-out repository."
            printf '%s\n' "Implement the task completely."
            printf '%s\n' "Inspect architecture before changing anything."
            printf '%s\n' "Reuse existing Ozarbox patterns."
            printf '%s\n' "Do not break existing functionality."
            printf '%s\n' "Run npm install if needed, then npm run check and npm run build."
            printf '%s\n' "Fix failures instead of ignoring them."
            printf '%s\n' "Do not expose secrets."
            printf '%s\n' "Do not modify GitHub billing, permissions or security settings."
            printf '%s\n' "Do not merge a pull request."
            printf '%s\n' "When finished, leave only intended changes."
          } > /tmp/ozarbox-task.txt

          gemini --approval-mode=yolo --model "$GEMINI_MODEL" --prompt "$(cat /tmp/ozarbox-task.txt)"

      - name: Verify build
        run: |
          npm install
          npm run check
          npm run build

      - name: Create branch and pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "Gemini made no file changes."
            exit 0
          fi
          BRANCH="ai/issue-${ISSUE_NUMBER}"
          git checkout -b "$BRANCH"
          git config user.name "Ozarbox AI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ai: implement issue #${ISSUE_NUMBER}"
          git push --set-upstream origin "$BRANCH"
          PR_URL=$(gh pr create --base main --head "$BRANCH" --title "AI: ${ISSUE_TITLE}" --body "Implemented automatically by Gemini. Original issue: #${ISSUE_NUMBER}. Automated checks: npm run check and npm run build.")
          echo "Created PR: $PR_URL"

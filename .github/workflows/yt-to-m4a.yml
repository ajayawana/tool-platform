name: YT to M4A

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: "YouTube video URL (only process content you own or are authorized to download)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: yt-to-m4a-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  convert:
    name: Extract, trim and package M4A
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate YouTube URL
        env:
          VIDEO_URL: ${{ inputs.youtube_url }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse, parse_qs
          raw = os.environ["VIDEO_URL"].strip()
          parsed = urlparse(raw if "://" in raw else "https://" + raw)
          host = (parsed.hostname or "").lower()
          allowed = {"youtube.com", "www.youtube.com", "m.youtube.com", "music.youtube.com", "youtu.be"}
          if parsed.scheme not in ("http", "https") or host not in allowed:
              raise SystemExit("Invalid YouTube URL.")
          if host == "youtu.be":
              video_id = parsed.path.strip("/").split("/")[0]
          else:
              video_id = parse_qs(parsed.query).get("v", [""])[0]
              if not video_id and parsed.path.startswith("/shorts/"):
                  parts = parsed.path.split("/")
                  video_id = parts[2] if len(parts) > 2 else ""
          if not video_id or len(video_id) > 20:
              raise SystemExit("Could not identify a YouTube video.")
          print("YouTube URL validated.")
          PY
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install yt-dlp
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade yt-dlp
      - name: Download best available audio
        env:
          VIDEO_URL: ${{ inputs.youtube_url }}
        run: |
          mkdir -p work
          yt-dlp --no-playlist --restrict-filenames --format "bestaudio/best" --output "work/source.%(ext)s" --no-warnings "$VIDEO_URL"
          SOURCE="$(find work -maxdepth 1 -type f | head -n 1)"
          test -n "$SOURCE"
          echo "SOURCE=$SOURCE" >> "$GITHUB_ENV"
          DURATION="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$SOURCE")"
          python -c 'import sys; d=float(sys.argv[1]); sys.exit("Video/audio is 12 seconds or shorter; nothing remains after trimming." if d <= 12 else 0)' "$DURATION"
      - name: Trim first 12 seconds and create M4A
        run: |
          CODEC="$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 "$SOURCE")"
          if [ "$CODEC" = "aac" ]; then
            ffmpeg -hide_banner -y -ss 12 -i "$SOURCE" -map 0:a:0 -vn -c:a copy -movflags +faststart work/yt-to-m4a.m4a
          else
            ffmpeg -hide_banner -y -ss 12 -i "$SOURCE" -map 0:a:0 -vn -c:a aac -b:a 256k -movflags +faststart work/yt-to-m4a.m4a
          fi
          test -s work/yt-to-m4a.m4a
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 work/yt-to-m4a.m4a
      - name: Upload downloadable M4A
        uses: actions/upload-artifact@v4
        with:
          name: yt-to-m4a-audio
          path: work/yt-to-m4a.m4a
          if-no-files-found: error
          retention-days: 1
